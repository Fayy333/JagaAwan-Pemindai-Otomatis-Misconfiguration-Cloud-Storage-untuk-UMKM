<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Batik Kita Jogja</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #faf6f0;
      color: #2b2118;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #5a3a22;
      color: #fff;
      text-align: center;
      padding: 2rem 1rem;
    }

    header h1 {
      font-size: clamp(1.5rem, 5vw, 2.4rem);
      letter-spacing: 0.03em;
    }

    header p {
      margin-top: 0.4rem;
      font-size: 0.95rem;
      opacity: 0.82;
      font-style: italic;
    }

    .banner {
      background: #fff3cd;
      color: #6b4c00;
      text-align: center;
      padding: 0.6rem 1rem;
      font-size: 0.82rem;
      border-bottom: 1px solid #e8d99a;
    }

    main {
      flex: 1;
      padding: 2rem 1.25rem;
      max-width: 1100px;
      margin: 0 auto;
      width: 100%;
    }

    .section-heading {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 1.25rem;
      color: #5a3a22;
      border-left: 4px solid #8a5a2b;
      padding-left: 0.65rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1.25rem;
    }

    .card {
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      transition: transform 0.18s, box-shadow 0.18s;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 18px rgba(90,58,34,0.13);
    }

    .img-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #e8e0d8;
      overflow: hidden;
    }

    .img-wrap img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .img-error-box {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #d4cfc9;
      color: #6b5e54;
      font-size: 0.72rem;
      text-align: center;
      padding: 0.5rem;
      gap: 0.4rem;
    }

    .img-error-box .icon { font-size: 1.8rem; }

    .card-body {
      padding: 0.85rem 1rem 1rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .card-name {
      font-size: 0.9rem;
      font-weight: 600;
      line-height: 1.35;
      color: #2b2118;
    }

    .card-price {
      font-size: 0.95rem;
      font-weight: 700;
      color: #8a5a2b;
    }

    footer {
      background: #5a3a22;
      color: rgba(255,255,255,0.65);
      text-align: center;
      padding: 1.1rem 1rem;
      font-size: 0.78rem;
    }

    @media (max-width: 360px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<header>
  <h1>Batik Kita Jogja</h1>
  <p>Batik tulis asli Yogyakarta</p>
</header>

<div class="banner" role="note">
  ⚠️ Website ini hanya untuk pengujian proyek kuliah (data fiktif).
</div>

<main>
  <p class="section-heading">Katalog Produk</p>
  <div class="grid" id="grid"></div>
</main>

<footer>
  Proyek JagaAwan &mdash; data fiktif
</footer>

<script>
  const BUCKET = "NAMA_BUCKET_FOTO";
  const BASE_URL = "https://storage.googleapis.com/" + BUCKET + "/produk/";

  const PRODUCTS = [
    { name: "Kemeja Batik Parang",             price: 285000, file: "kemeja-parang-01.jpg" },
    { name: "Kemeja Batik Kawung",             price: 295000, file: "kemeja-kawung-01.jpg" },
    { name: "Dress Batik Mega Mendung",        price: 350000, file: "dress-megamendung-01.jpg" },
    { name: "Dress Batik Truntum",             price: 340000, file: "dress-truntum-01.jpg" },
    { name: "Kain Batik Sogan (per meter)",    price: 180000, file: "kain-sogan-01.jpg" },
    { name: "Kain Batik Sidomukti (per meter)",price: 195000, file: "kain-sidomukti-01.jpg" },
  ];

  function formatRupiah(n) {
    return "Rp " + n.toLocaleString("id-ID");
  }

  function onImgError(img) {
    img.style.display = "none";
    var box = img.parentElement.querySelector(".img-error-box");
    if (box) box.style.display = "flex";
  }

  var grid = document.getElementById("grid");

  PRODUCTS.forEach(function(p) {
    var card = document.createElement("article");
    card.className = "card";

    var wrap = document.createElement("div");
    wrap.className = "img-wrap";

    var img = document.createElement("img");
    img.src = BASE_URL + p.file;
    img.alt = p.name;
    img.loading = "lazy";
    img.onerror = function() { onImgError(this); };

    var errBox = document.createElement("div");
    errBox.className = "img-error-box";
    errBox.setAttribute("aria-live", "polite");
    errBox.innerHTML = '<span class="icon">🚫</span><span>Foto tidak bisa dimuat<br>(cek izin bucket)</span>';

    wrap.appendChild(img);
    wrap.appendChild(errBox);

    var body = document.createElement("div");
    body.className = "card-body";

    var name = document.createElement("p");
    name.className = "card-name";
    name.textContent = p.name;

    var price = document.createElement("p");
    price.className = "card-price";
    price.textContent = formatRupiah(p.price);

    body.appendChild(name);
    body.appendChild(price);
    card.appendChild(wrap);
    card.appendChild(body);
    grid.appendChild(card);
  });
</script>

</body>
</html>
